[project]
name = "refproj"
version = "0.1.0"
description = "Tiny reference project used to exercise the engine's hooks. Not a real product."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

# Not a package: nothing to build, so `uv sync` only installs the dev tools.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# gate-allow: an evaluation fixture's own pyproject, laid over the reference project in a sandbox — not the engine's lint or type settings
